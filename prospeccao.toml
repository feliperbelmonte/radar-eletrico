# Prospecção de empresas — o que o leads.py procura nos dados abertos de CNPJ da Receita.
# Para mudar o público-alvo, edite este arquivo (não precisa mexer no código).

[fonte]
# A Receita publica a base num compartilhamento público (Nextcloud) acessado por WebDAV.
# O token é o código no fim do link https://arquivos.receitafederal.gov.br/index.php/s/<token>
# e muda de vez em quando: se a coleta falhar com "dados de CNPJ não encontrados", abra
# arquivos.receitafederal.gov.br > Dados > Cadastros > CNPJ, copie o token novo e ponha aqui.
servidor = "https://arquivos.receitafederal.gov.br"
compartilhamentos = [
  { token = "YggdBLfdninEJX9", raiz = "" },
  { token = "gn672Ad4CF8N6TK", raiz = "Dados/Cadastros/CNPJ" },
]
# Reserva: espelhos com listagem HTML simples (pastas AAAA-MM).
espelhos = ["https://dados-abertos-rf-cnpj.casadosdados.com.br/arquivos/"]
partes = 10              # Estabelecimentos0..9.zip e Empresas0..9.zip
timeout_segundos = 120
tentativas = 4

[filtro]
# Porte: "00" = não informado, "01" = microempresa, "03" = pequeno porte, "05" = demais (médias e grandes).
portes = ["00", "01", "03", "05"]
incluir_mei = false        # MEI normalmente é um profissional sozinho, sem demanda de projeto
anos_minimos_atividade = 1
# Aceitar também quem tem o CNAE do segmento só como atividade secundária.
usar_cnae_secundario = false
# Vazio = Brasil inteiro. Ex.: ["PR", "SC", "RS"]
ufs = []

# ---------------------------------------------------------------------------
# Segmentos: quem costuma precisar de projeto elétrico. A ordem é a prioridade
# dentro de cada UF. "atividade" entra na mensagem ("trabalha com {atividade}").
# Para tirar um segmento, apague o bloco; para incluir, copie um bloco e troque os CNAEs.
# ---------------------------------------------------------------------------
[[segmento]]
id = "eletrica"
rotulo = "Instalação elétrica"
atividade = "instalações elétricas"
cnaes = ["4321500"]

[[segmento]]
id = "arquitetura"
rotulo = "Arquitetura"
atividade = "projetos de arquitetura"
cnaes = ["7111100"]

[[segmento]]
id = "construcao"
rotulo = "Construtora"
atividade = "construção"
cnaes = ["4120400"]

[[segmento]]
id = "engenharia"
rotulo = "Engenharia"
atividade = "engenharia"
cnaes = ["7112000"]

[[segmento]]
id = "industrial"
rotulo = "Montagem industrial"
atividade = "montagem e instalação industrial"
cnaes = ["3321000", "4292802"]

[[segmento]]
id = "redes"
rotulo = "Redes de energia"
atividade = "redes de energia elétrica"
cnaes = ["4221902", "4221903"]

[[segmento]]
id = "iluminacao"
rotulo = "Iluminação e sinalização"
atividade = "iluminação e sinalização"
cnaes = ["4329104"]

[[segmento]]
id = "climatizacao"
rotulo = "Climatização"
atividade = "climatização e refrigeração"
cnaes = ["4322302"]

[prioridade]
# Primeiro as cidades da lista (na ordem), depois as UFs (na ordem), depois o resto do país.
# Cidade no formato "NOME/UF", como na Receita (sem acento, maiúsculas).
# Felipe tem CREA-PR (prioridade PR) e mora em Jaraguá do Sul/SC: dentro do PR, começa
# pela região de Curitiba e litoral, a parte do estado mais perto dele.
cidades = [
  "CURITIBA/PR", "SAO JOSE DOS PINHAIS/PR", "PINHAIS/PR", "COLOMBO/PR", "ARAUCARIA/PR",
  "CAMPO LARGO/PR", "FAZENDA RIO GRANDE/PR", "ALMIRANTE TAMANDARE/PR", "PIRAQUARA/PR",
  "CAMPINA GRANDE DO SUL/PR", "QUATRO BARRAS/PR", "LAPA/PR", "RIO NEGRO/PR",
  "PARANAGUA/PR", "GUARATUBA/PR", "MATINHOS/PR", "PONTAL DO PARANA/PR",
]
ufs = ["PR", "SC", "RS", "SP", "MS", "MG", "RJ", "GO", "DF", "MT", "ES"]

[saida]
max_empresas = 3000      # quantas entram no painel (as mais prioritárias)
painel_titulo = "Prospecção Elétrica"

[remetente]
nome = "Felipe"
registro = "CREA-PR"

# Modelos de mensagem. Cada empresa recebe sempre o mesmo modelo (sorteado pelo CNPJ),
# para variar o texto entre contatos. Campos: {nome} {registro} {empresa} {cidade} {atividade}.
[[mensagem]]
texto = "Oi, tudo bem? Aqui é o {nome}, engenheiro eletricista ({registro}). Vi que a {empresa} trabalha com {atividade} em {cidade}. Faço só a parte de projeto elétrico (residencial, comercial e industrial, SPDA, laudos, subestação e ART), à distância, para empresas que preferem terceirizar isso ou precisam de reforço quando a demanda aperta. Vocês costumam precisar de projeto elétrico em algum serviço? Se não fizer sentido, é só me avisar que não mando mais."

[[mensagem]]
texto = "Olá! Meu nome é {nome}, sou engenheiro eletricista ({registro}). Encontrei a {empresa} pesquisando empresas de {atividade} em {cidade}. Trabalho só com projeto elétrico (de residência a indústria, SPDA, laudos e ART), sem concorrer na execução. Se em algum momento vocês precisarem terceirizar projeto, posso ajudar. Faz sentido conversarmos? Se não, me avisa que não incomodo mais."

[[mensagem]]
texto = "Oi, tudo certo? Sou o {nome}, engenheiro eletricista ({registro}). Vi a {empresa} em {cidade} e queria me apresentar: faço projetos elétricos, laudos e ART para empresas que precisam de um engenheiro eletricista nessa parte, sem custo fixo, cobrando por projeto. Hoje vocês têm alguém que faz isso ou costumam terceirizar? Se não for o caso, é só me falar."
